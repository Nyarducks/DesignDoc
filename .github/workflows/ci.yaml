name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agent-skills-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Skill layout check
        run: bash .agents/skills/agent-guidance/scripts/check-skills.sh
      - name: Skill tests
        run: bats .agents/skills/*/tests/*.bats

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dogfood — docs freshness on this repo
        run: bash .agents/skills/design-doc/scripts/check-docs-stale.sh
      - name: Dogfood — docs frontmatter on this repo
        run: bash .agents/skills/design-doc/scripts/check-doc-frontmatter.sh
      - name: Check-script copies stay in sync across skills
        run: |
          for s in check-docs-stale.sh check-doc-frontmatter.sh; do
            diff ".agents/skills/design-doc/scripts/$s" ".agents/skills/doc-checks-ci/scripts/$s"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck .agents/skills/*/scripts/*.sh
