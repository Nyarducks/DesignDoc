name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fixture tests — stale
        run: bash tests/test_check_docs_stale.sh
      - name: Fixture tests — frontmatter
        run: bash tests/test_check_doc_frontmatter.sh
      - name: Fixture tests — CI installer
        run: bash tests/test_doc_checks_ci.sh
      - name: Dogfood — docs freshness on this repo
        run: bash .agents/skills/design-doc/scripts/check-docs-stale.sh
      - name: Dogfood — docs frontmatter on this repo
        run: bash .agents/skills/design-doc/scripts/check-doc-frontmatter.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck .agents/skills/*/scripts/*.sh tests/*.sh
