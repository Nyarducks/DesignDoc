name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # doc-checks-ci:start — managed by the doc-checks-ci skill; remove with `doc-checks-ci.sh uninstall`
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Docs sources contract
        run: bash .agents/skills/doc-checks-ci/scripts/check-docs-stale.sh "origin/${{ github.base_ref || github.event.repository.default_branch }}"
      - name: Docs frontmatter
        run: bash .agents/skills/doc-checks-ci/scripts/check-doc-frontmatter.sh
  # doc-checks-ci:end
  agent-skills-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Skill layout check
        run: bash .agents/skills/agent-guidance/scripts/check-skills.sh
      - name: Skill tests
        run: bats .agents/skills/*/tests/*.bats

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check-script copies stay in sync across skills
        run: |
          for s in check-docs-stale.sh check-doc-frontmatter.sh; do
            diff ".agents/skills/design-doc/scripts/$s" ".agents/skills/doc-checks-ci/scripts/$s"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck .agents/skills/*/scripts/*.sh
